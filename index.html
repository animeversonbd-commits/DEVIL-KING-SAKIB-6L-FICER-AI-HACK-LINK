        // ============================
        // USER DATA (only device needed now)
        // ============================
        window.addEventListener('DOMContentLoaded', () => {
            const ua = navigator.userAgent;
            if (/Android/i.test(ua)) {
                const match = ua.match(/Android\s([0-9\.]+);\s([^;]+)/);
                window.userData.device = match ? match[2] : "Android Mobile";
            } else if (/iPhone|iPad|iPod/i.test(ua)) {
                window.userData.device = "iOS Device";
            } else {
                window.userData.device = "PC Browser";

        setInterval(() => {

            document.getElementById('ping-text').innerText = `PING: ${randPing}MS`;
        }, 2000);

        // ============================
        // MARKET LOGIC
        // ============================
        function getType(num) {
            return num >= 5 ? "BIG" : "SMALL";
        }

        function analyzeMarketTrend(historyList) {
            if (!historyList || historyList.length < 2) return "BIG";
            const lastNum1 = historyList[0].number;
            const lastNum2 = historyList[1].number;
            const searchKey = `${lastNum2}+${lastNum1}`;
            let basePick = patternLogic[searchKey] || 'SMALL';
            if (isFlipped) {
                return basePick === "BIG" ? "SMALL" : "BIG";
            }
            return basePick;
        }

        // ============================
        // POLLING ENGINE
        // ============================
        window.startMarketPolling = function() {
            setInterval(async () => {
                if (!window.isLoggedIn) return;
                try {
                    const url = API_SOURCES[apiIndex] + Date.now();
                    let res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    let json = await res.json();

                    if (json && json.data && json.data.list && json.data.list.length > 0) {
                        let list = json.data.list;
                        let nextIssue = (BigInt(list[0].issueNumber) + 1n).toString();

                        if (currentPeriod !== nextIssue) {
                            if (currentPeriod !== null && lastPredictedResult !== null) {
                                const actualResult = getType(parseInt(list[0].number));
                                const isWin = (actualResult === lastPredictedResult);
                                if (!isWin) {
                                    isFlipped = !isFlipped;
                                }
                            }

                            let finalPick = analyzeMarketTrend(list);
                            let pool = finalPick === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                            let predictedNum = pool[Math.floor(Math.random() * pool.length)];

                            nextPrediction = { bs: finalPick, num: predictedNum };
                            currentPeriod = nextIssue;
                            window.fetchedPeriod = nextIssue.slice(-4);

                            if (window.fetchedPeriod !== window.lastProcessedPeriod) {
                                window.lastProcessedPeriod = window.fetchedPeriod;
                                triggerAutoUpdate();
                            }

                            lastPredictedResult = finalPick;
                        }
                    }
                } catch (e) {
                    apiIndex = (apiIndex + 1) % API_SOURCES.length;
                }
            }, 1500);
        };

        // ============================
        // UI UPDATES
        // ============================
        function triggerAutoUpdate() {
            const displayBox = document.getElementById('display-box');
            displayBox.innerHTML = `
            <div class="spider-ring">
              <div class="loading-ring ring-1"></div>
              <div class="loading-ring ring-2"></div>
            </div>
            <div class="status-sub" style="margin-top:5px;">AUTO REFRESH...</div>
            <div class="progress-bar"><div class="progress-fill" id="p-fill" style="width:0%;"></div></div>
          `;

            let width = 0;
            const fill = document.getElementById('p-fill');
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    showFinalResultHTML();
                } else {
                    width += 10;
                    if (fill) fill.style.width = width + '%';
                }
            }, 60);
        }

        window.startManualInjection = function() {
            triggerAutoUpdate();
        };

        function showFinalResultHTML() {
            const displayBox = document.getElementById('display-box');
            if (!nextPrediction) return;

            let bsResult = nextPrediction.bs;
            let luckyNum = nextPrediction.num;
            let textColor = (bsResult === "BIG") ? "#00ffcc" : "#ffaa00";

            displayBox.innerHTML = `
            <div class="glass-period-box">PERIOD: ${window.fetchedPeriod}</div>
            <div class="text-result" style="color:${textColor};">${bsResult}</div>
            <div class="num-container">
              <div class="result-number-fallback">${luckyNum}</div>
            </div>
          `;
        }

        // ============================
        // DRAGGABLE
        // ============================
        function makeDraggable(dragZone, moveTarget, isCentered) {
            let active = false;
            let currentX = 0,
                currentY = 0,
                initialX = 0,
                initialY = 0;
            let xOffset = 0,
                yOffset = 0;

            const dragStart = (e) => {
                if (e.target.closest('input') || e.target.closest('button')) return;
                initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
                initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
                active = true;
            };

            const dragEnd = () => {
                initialX = currentX;
                initialY = currentY;
                active = false;
            };

            const drag = (e) => {
                if (active) {
                    e.preventDefault();
                    currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
                    currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
                    xOffset = currentX;
                    yOffset = currentY;
                    if (isCentered) {
                        moveTarget.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px))`;
                    } else {
                        moveTarget.style.transform = `translate(${currentX}px, ${currentY}px)`;
                    }
                }
            };

            dragZone.addEventListener("touchstart", dragStart, { passive: false });
            document.addEventListener("touchend", dragEnd);
            document.addEventListener("touchmove", drag, { passive: false });
            dragZone.addEventListener("mousedown", dragStart);
            document.addEventListener("mouseup", dragEnd);
            document.addEventListener("mousemove", drag);
        }

        makeDraggable(document.getElementById("main"), document.getElementById("main-wrapper"), true);
        makeDraggable(document.getElementById("mini"), document.getElementById("mini"), false);

        };

        window.closeM = function() {
            document.getElementById('main-wrapper').style.display = 'none';
            document.getElementById('mini').style.display = 'flex';
